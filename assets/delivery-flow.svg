<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1113" viewBox="0 0 3000 1113">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111318"/>
    </marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #111318; }
      .title { font-size: 44px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .small { font-size: 18px; }
      .tiny { font-size: 16px; fill: #495057; }
      .box { stroke: #111318; stroke-width: 3; rx: 12; }
      .control { fill: #d3f9d8; }
      .worker { fill: #f1f3f5; }
      .event { fill: #d0ebff; }
      .gate { fill: #fff3bf; }
      .danger { fill: #ffe3e3; }
      .line { stroke: #111318; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 10 8; }
      .boundary { fill: none; stroke: #868e96; stroke-width: 3; stroke-dasharray: 12 10; rx: 20; }
    </style>
  </defs>

  <rect width="3000" height="1113" fill="#ffffff"/>
  <text x="90" y="80" class="title">Herdr fixed-role orchestration flow</text>
  <text x="90" y="122" class="small">same workspace only · fixed role plus separate task summary · never close user panes</text>

  <rect x="60" y="165" width="2880" height="600" class="boundary"/>
  <text x="90" y="205" class="label">same workspace only</text>

  <rect x="90" y="260" width="260" height="120" class="box gate"/>
  <text x="120" y="310" class="label">Approved plan</text>
  <text x="120" y="345" class="tiny">locked inputs</text>

  <rect x="430" y="240" width="340" height="160" class="box control"/>
  <text x="460" y="290" class="label">P1 claim or</text>
  <text x="460" y="322" class="label">same-workspace forward</text>
  <text x="460" y="360" class="tiny">p1_orchestrator</text>

  <rect x="850" y="235" width="330" height="170" class="box control"/>
  <text x="885" y="287" class="label">atomic controller tick</text>
  <text x="885" y="325" class="tiny">workspace-state.json</text>
  <text x="885" y="355" class="tiny">ownership queue / capacity queue</text>

  <rect x="1280" y="185" width="360" height="105" class="box worker"/>
  <text x="1310" y="230" class="label">P2 · p2_impl</text>
  <text x="1310" y="260" class="tiny">task: state helper</text>
  <rect x="1280" y="315" width="360" height="105" class="box worker"/>
  <text x="1310" y="360" class="label">P3 · p3_impl</text>
  <text x="1310" y="390" class="tiny">task: pool recovery</text>
  <rect x="1280" y="445" width="360" height="105" class="box worker"/>
  <text x="1310" y="490" class="label">P4 · p4_impl</text>
  <text x="1310" y="520" class="tiny">task: controller watcher</text>
  <text x="1280" y="590" class="small">P2/P3/P4 fixed warm implementation slots</text>

  <rect x="1750" y="300" width="300" height="120" class="box event"/>
  <text x="1785" y="350" class="label">immutable receipts</text>
  <text x="1785" y="382" class="tiny">contract · lane · generation</text>

  <rect x="2160" y="280" width="300" height="170" class="box gate"/>
  <text x="2190" y="325" class="label">P5 integration</text>
  <text x="2190" y="357" class="label">(Compact + Standard)</text>
  <text x="2190" y="390" class="tiny">p5_integration</text>
  <text x="2190" y="420" class="tiny">normal forward commit</text>

  <rect x="2540" y="280" width="340" height="170" class="box worker"/>
  <text x="2570" y="325" class="label">P6 independent QC</text>
  <text x="2570" y="357" class="label">(Compact + Standard)</text>
  <text x="2570" y="390" class="tiny">p6_review</text>
  <text x="2570" y="420" class="tiny">Compact stops after P6 PASS</text>

  <rect x="2540" y="480" width="340" height="180" class="box worker"/>
  <text x="2570" y="525" class="label">Standard only:</text>
  <text x="2570" y="557" class="label">applicable P7/P8/P9</text>
  <text x="2570" y="589" class="label">concurrently</text>
  <text x="2570" y="620" class="tiny">p7_qc · p8_design · p9_persona</text>
  <text x="2570" y="645" class="tiny">same immutable candidate</text>

  <rect x="2540" y="690" width="340" height="65" class="box worker"/>
  <text x="2570" y="725" class="label">P5 install/push/deploy</text>
  <text x="2570" y="748" class="tiny">only when approved</text>

  <rect x="430" y="835" width="330" height="120" class="box event"/>
  <text x="460" y="882" class="label">Herdr live state</text>
  <text x="460" y="914" class="tiny">agents · receipts</text>

  <rect x="850" y="835" width="330" height="120" class="box event"/>
  <text x="880" y="882" class="label">workspace watcher</text>
  <text x="880" y="914" class="tiny">observe only</text>

  <rect x="1280" y="835" width="330" height="120" class="box event"/>
  <text x="1310" y="882" class="label">event queue</text>
  <text x="1310" y="914" class="tiny">persist before signal</text>

  <rect x="1750" y="835" width="300" height="120" class="box control"/>
  <text x="1780" y="882" class="label">P1 wake</text>
  <text x="1780" y="914" class="tiny">yield only after proof</text>

  <rect x="2160" y="820" width="330" height="150" class="box danger"/>
  <text x="2190" y="865" class="label">recovery boundary</text>
  <text x="2190" y="898" class="tiny">foreign workspace never adopted</text>
  <text x="2190" y="928" class="tiny">never close user panes</text>

  <line x1="350" y1="320" x2="430" y2="320" class="line"/>
  <line x1="770" y1="320" x2="850" y2="320" class="line"/>
  <line x1="1180" y1="320" x2="1280" y2="240" class="line"/>
  <line x1="1180" y1="320" x2="1280" y2="370" class="line"/>
  <line x1="1180" y1="320" x2="1280" y2="500" class="line"/>
  <line x1="1640" y1="370" x2="1750" y2="360" class="line"/>
  <line x1="2050" y1="360" x2="2160" y2="365" class="line"/>
  <line x1="2460" y1="365" x2="2540" y2="365" class="line"/>
  <line x1="2710" y1="450" x2="2710" y2="480" class="line"/>
  <line x1="2710" y1="660" x2="2710" y2="690" class="line"/>
  <line x1="760" y1="895" x2="850" y2="895" class="line dashed"/>
  <line x1="1180" y1="895" x2="1280" y2="895" class="line dashed"/>
  <line x1="1610" y1="895" x2="1750" y2="895" class="line dashed"/>
  <line x1="1900" y1="835" x2="1015" y2="405" class="line dashed"/>
  <line x1="1180" y1="835" x2="1180" y2="405" class="line dashed"/>
  <text x="90" y="1040" class="tiny">P5 integration -> P6 independent QC · Standard only: applicable P7/P8/P9 concurrently · Herdr live state -> workspace watcher -> event queue -> P1 wake · workspace-state.json -> controller tick</text>
</svg>
